<svg viewBox="0 0 300 300" xmlns="http://www.w3.org/2000/svg">
  <!-- Outer shield shape background -->
  <defs>
    <style>
      .retro-text { font-family: 'Playfair Display', Georgia, serif; font-weight: bold; }
      .badge-outline { stroke: #003D82; stroke-width: 3; fill: none; }
      .badge-fill { fill: #003D82; }
      .accent-fill { fill: #C8102E; }
    </style>
  </defs>

  <!-- Shield background -->
  <path d="M 150 20 L 220 60 L 220 140 Q 220 190 150 260 Q 80 190 80 140 L 80 60 Z"
        class="badge-fill" stroke="#F8F8F8" stroke-width="2"/>

  <!-- Inner cream panel -->
  <path d="M 150 35 L 205 70 L 205 135 Q 205 180 150 240 Q 95 180 95 135 L 95 70 Z"
        fill="#F5EFE7" stroke="#003D82" stroke-width="2"/>

  <!-- Football at top -->
  <ellipse cx="150" cy="85" rx="18" ry="24" class="badge-fill"/>
  <line x1="150" y1="70" x2="150" y2="100" stroke="#F5EFE7" stroke-width="2"/>
  <line x1="140" y1="85" x2="160" y2="85" stroke="#F5EFE7" stroke-width="1"/>

  <!-- Decorative lines -->
  <line x1="105" y1="120" x2="195" y2="120" stroke="#003D82" stroke-width="2"/>
  <line x1="105" y1="126" x2="195" y2="126" stroke="#C8102E" stroke-width="1"/>

  <!-- Star elements for retro flair -->
  <circle cx="115" cy="110" r="4" class="accent-fill"/>
  <circle cx="185" cy="110" r="4" class="accent-fill"/>

  <!-- Text styling -->
  <text x="150" y="165" text-anchor="middle" class="retro-text" font-size="18" fill="#003D82">
    LEGENDS
  </text>
  <text x="150" y="185" text-anchor="middle" class="retro-text" font-size="18" fill="#C8102E">
    COLLIDE
  </text>

  <!-- Bottom date-style element -->
  <text x="150" y="225" text-anchor="middle" font-family="'Courier New', monospace" font-size="11" fill="#003D82">
    FOOTBALL SIMULATOR
  </text>
</svg>