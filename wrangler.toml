name = "legendscollide"
compatibility_date = "2024-09-23"
pages_build_output_dir = "web/dist"

# SPA fallback for the newer Workers-based Pages runtime. A committed
# `_redirects` catch-all ("/* / 200") was tried first and shipped broken on
# this project: it took priority over every existing static file, so
# assets/*.js and *.css (and everything else) came back as the index.html
# shell with the wrong Content-Type, blanking the app. That's the legacy
# Pages contract (existing files win over `_redirects`) not holding here.
# This is the documented mechanism for the newer runtime instead, and it
# doesn't have that failure mode: a real file is always served as itself,
# and only a genuine miss falls back to the SPA shell.
[assets]
not_found_handling = "single-page-application"
